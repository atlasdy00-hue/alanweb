name: Refresh publications from Google Scholar

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday at 06:00 UTC
  workflow_dispatch: {}

# the "git push" step below needs write access to the repo contents
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Fetch latest publications
        run: python scripts/fetch_publications.py

      - name: Commit changes if data/publications.js was updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/publications.js
          git diff --cached --quiet || git commit -m "Auto-update publications from Google Scholar"
          git push
